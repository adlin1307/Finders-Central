{% extends "base.html" %}

{% block title %}Student Login — Finder's Central{% endblock %}

{% block content %}
<div class="form-wrapper">
    <div class="form-header">
        <h1>Student Login</h1>
        <p>Sign in using your student register number & password.</p>
    </div>

    {% if error %}
    <div class="alert-box alert-error">
        <span>⚠️</span> {{ error }}
    </div>
    {% endif %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next or '' }}">

        <div class="form-group">
            <label class="form-label" for="register_number">Register Number</label>
            <input
                type="text"
                id="register_number"
                name="register_number"
                placeholder="e.g. URK25CS1004"
                autocomplete="username"
                required
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">
            Sign In
        </button>
    </form>

    <div class="form-footer-text">
        Don't have an account?
        <a href="{{ url_for('signup') }}" style="font-weight: 600;">Create Account</a>
    </div>
</div>
{% endblock %}
