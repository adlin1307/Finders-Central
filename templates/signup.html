{% extends "base.html" %}

{% block title %}Create Account — Finder's Central{% endblock %}

{% block content %}
<div class="form-wrapper">
    <div class="form-header">
        <h1>Create Account</h1>
        <p>Register with your university student credentials.</p>
    </div>

    {% if error %}
    <div class="alert-box alert-error">
        <span>⚠️</span> {{ error }}
    </div>
    {% endif %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="e.g. John Doe"
                required
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="register_number">Register Number</label>
            <input
                type="text"
                id="register_number"
                name="register_number"
                placeholder="e.g. URK25CS1004"
                pattern="URK[0-9]{2}[A-Za-z]{2}[0-9]{4}"
                title="Must match pattern like URK25CS1004"
                required
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="email">Campus Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="e.g. student@karunya.edu.in"
                required
            >
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a strong password (min 4 chars)"
                minlength="4"
                required
            >
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">
            Register Account
        </button>
    </form>

    <div class="form-footer-text">
        Already have an account?
        <a href="{{ url_for('login') }}" style="font-weight: 600;">Sign In</a>
    </div>
</div>
{% endblock %}
